<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator by Gagin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 165, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 100, 0, 0.1) 0%, transparent 50%);
        }

        h1 {
            color: #ffa500;
            margin-bottom: 25px;
            font-size: 32px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 165, 0, 0.5);
        }

        .calculator {
            background: #2a2a2a;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 
                0 0 40px rgba(255, 165, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 340px;
            border: 1px solid #3a3a3a;
        }

        .display {
            background: #0f0f0f;
            border: 2px solid #ffa500;
            border-radius: 8px;
            padding: 25px 20px;
            font-size: 36px;
            text-align: right;
            width: 100%;
            margin-bottom: 20px;
            outline: none;
            font-weight: bold;
            color: #ffa500;
            font-family: 'Courier New', monospace;
            box-shadow: inset 0 0 15px rgba(255, 165, 0, 0.2);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 22px;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.15s;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-number {
            background: #3a3a3a;
            color: #ffffff;
            border: 1px solid #4a4a4a;
        }

        .btn-number:hover {
            background: #4a4a4a;
        }

        .btn-operator {
            background: #ffa500;
            color: #1a1a1a;
        }

        .btn-operator:hover {
            background: #ffb733;
        }

        .btn-clear {
            background: #ff4444;
            color: white;
            grid-column: span 2;
        }

        .btn-clear:hover {
            background: #ff5555;
        }

        .btn-equals {
            background: #00cc66;
            color: white;
            grid-column: span 2;
        }

        .btn-equals:hover {
            background: #00dd77;
        }

        .footer {
            color: #666;
            margin-top: 20px;
            font-size: 12px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <h1>Calculator by Gagin</h1>
    <div class="calculator">
        <input type="text" class="display" id="display" readonly>
        <div class="buttons">
            <button type="button" class="btn-clear" onclick="clearDisplay()">C</button>
            <button type="button" class="btn-operator" onclick="deleteLast()">←</button>
            <button type="button" class="btn-operator" onclick="appendOperator('/')">÷</button>
            
            <button type="button" class="btn-number" onclick="appendNumber('7')">7</button>
            <button type="button" class="btn-number" onclick="appendNumber('8')">8</button>
            <button type="button" class="btn-number" onclick="appendNumber('9')">9</button>
            <button type="button" class="btn-operator" onclick="appendOperator('*')">×</button>
            
            <button type="button" class="btn-number" onclick="appendNumber('4')">4</button>
            <button type="button" class="btn-number" onclick="appendNumber('5')">5</button>
            <button type="button" class="btn-number" onclick="appendNumber('6')">6</button>
            <button type="button" class="btn-operator" onclick="appendOperator('-')">−</button>
            
            <button type="button" class="btn-number" onclick="appendNumber('1')">1</button>
            <button type="button" class="btn-number" onclick="appendNumber('2')">2</button>
            <button type="button" class="btn-number" onclick="appendNumber('3')">3</button>
            <button type="button" class="btn-operator" onclick="appendOperator('+')">+</button>
            
            <button type="button" class="btn-number" onclick="appendNumber('0')">0</button>
            <button type="button" class="btn-number" onclick="appendNumber('.')">.</button>
            <button type="button" class="btn-equals" onclick="calculate()">=</button>
        </div>
    </div>
    <div class="footer">© 2026 GAGIN</div>

    <script>
        let display = document.getElementById('display');
        let currentInput = '';

        function appendNumber(number) {
            currentInput += number;
            display.value = currentInput;
        }

        function appendOperator(operator) {
            if (currentInput === '') return;
            currentInput += operator;
            display.value = currentInput;
        }

        function clearDisplay() {
            currentInput = '';
            display.value = '';
        }

        function deleteLast() {
            currentInput = currentInput.slice(0, -1);
            display.value = currentInput;
        }

        function calculate() {
            if (currentInput === '') return;
            
            try {
                let expression = currentInput.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
                
                if (!/^[\d+\-*/.() ]+$/.test(expression)) {
                    display.value = 'Ошибка';
                    currentInput = '';
                    return;
                }
                
                let result = Function('"use strict"; return (' + expression + ')')();
                
                if (result === Infinity || result === -Infinity || isNaN(result)) {
                    display.value = 'Ошибка';
                    currentInput = '';
                } else {
                    result = Math.round(result * 10000000000) / 10000000000;
                    display.value = result;
                    currentInput = result.toString();
                }
            } catch (error) {
                display.value = 'Ошибка';
                currentInput = '';
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key >= '0' && event.key <= '9') {
                appendNumber(event.key);
            } else if (event.key === '.') {
                appendNumber('.');
            } else if (event.key === '+' || event.key === '-' || event.key === '*' || event.key === '/') {
                appendOperator(event.key);
            } else if (event.key === 'Enter' || event.key === '=') {
                event.preventDefault();
                calculate();
            } else if (event.key === 'Escape') {
                clearDisplay();
            } else if (event.key === 'Backspace') {
                deleteLast();
            }
        });
    </script>
</body>
</html>
